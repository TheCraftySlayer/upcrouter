<meta content="6.3.1-location-svg-fix" name="application-version"/><!-- Permission-free Google Maps current-location handoff; text-only Leaflet attribution; accessible SVG handling; exact Assessor parcel deep links; native official parcel boundaries; dedicated Primary/Revisit routes; navigation-point confirmation; Field Mode. --></head>
<body>
<div id="root"></div>
<script>
(() => {
  "use strict";
  const MAP_LABEL = "Route map with selectable property stops, official parcel boundaries, Primary Route lines, and Revisit Route lines.";

  function apply(root) {
    const elements = [];
    if (root && root.nodeType === 1) elements.push(root);
    if (root && root.querySelectorAll) elements.push(...root.querySelectorAll("svg, .route-map, .leaflet-container"));

    for (const element of elements) {
      if (element.matches && element.matches(".route-map, .leaflet-container")) {
        element.setAttribute("role", "region");
        if (!element.hasAttribute("aria-label")) element.setAttribute("aria-label", MAP_LABEL);
      }
      if (element.matches && element.matches("svg")) {
        const named = element.hasAttribute("aria-label") || element.hasAttribute("aria-labelledby") || Boolean(element.querySelector("title"));
        if (!named) {
          element.setAttribute("aria-hidden", "true");
          element.setAttribute("focusable", "false");
          element.setAttribute("role", "presentation");
        }
      }
    }

    if (!root || !document.createTreeWalker) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const removals = [];
    while (walker.nextNode()) {
      const node = walker.currentNode;
      if ((node.nodeValue || "").trim().toLowerCase() !== "svg") continue;
      const parent = node.parentElement;
      if (!parent || parent.closest("script, style, svg")) continue;
      if (parent.closest("[data-icon], [data-sonner-toast], .leaflet-container, .route-map, button, a")) removals.push(node);
    }
    for (const node of removals) node.remove();
  }

  const start = () => {
    apply(document);
    const observer = new MutationObserver(records => {
      for (const record of records) {
        for (const node of record.addedNodes) {
          if (node.nodeType === 1) apply(node);
          else if (node.nodeType === 3) apply(record.target);
        }
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once: true });
  else start();
})();
</script>
